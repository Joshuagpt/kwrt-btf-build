
name: Resolve Kwrt Historical Source Versions

on:
  workflow_dispatch:
    inputs:
      build_date:
        description: "Original Kwrt build date"
        required: true
        default: "2026-03-30"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl jq python3

      - name: Resolve historical source commits
        env:
          BUILD_DATE: ${{ inputs.build_date }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! [[ "$BUILD_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid build date"
            exit 1
          fi

          UNTIL="${BUILD_DATE}T23:59:59+08:00"

          mkdir -p source-lock

          resolve_commit() {
            local repo="$1"
            local branch="$2"
            local path="$3"

            local encoded_path
            local encoded_until
            local api_url
            local response
            local result

            encoded_path=$(python3 -c \
              'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' \
              "$path")

            encoded_until=$(python3 -c \
              'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' \
              "$UNTIL")

            api_url="https://api.github.com/repos/${repo}/commits?path=${encoded_path}&sha=${branch}&until=${encoded_until}&per_page=1"

            response=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "$api_url")

            result=$(echo "$response" | jq -r '
              if length == 0 then
                empty
              else
                .[0] |
                [
                  .sha,
                  .commit.committer.date,
                  (.commit.message | split("\n")[0])
                ] | @tsv
              end
            ')

            if [ -z "$result" ]; then
              echo "ERROR: No historical commit found: ${repo} ${path}"
              return 1
            fi

            printf '%s\n' "$result"
          }

          echo "===== OPENWRT BASE TAG =====" \
            | tee source-lock/source-lock.txt

          git ls-remote --tags \
            https://github.com/openwrt/openwrt.git \
            'refs/tags/v25.12.2*' \
            | tee -a source-lock/source-lock.txt

          echo >> source-lock/source-lock.txt
          echo "===== KWRT ORIGINAL COMMIT =====" \
            | tee -a source-lock/source-lock.txt

          echo "ab0b3066ed2152a1785fd7d4dba8a10b08b2e5c0" \
            | tee -a source-lock/source-lock.txt

          echo >> source-lock/source-lock.txt
          echo "===== IMMORTALWRT HISTORICAL FILES =====" \
            | tee -a source-lock/source-lock.txt

          IMMORTAL_PATHS=(
            "package/kernel/linux/modules/video.mk"
            "package/network/utils/nftables/patches/002-nftables-add-fullcone-expression-support.patch"
            "package/libs/libnftnl/patches/001-libnftnl-add-fullcone-expression-support.patch"
            "package/firmware/wireless-regdb/patches/600-custom-change-txpower-and-dfs.patch"
            "config/Config-kernel.in"
            "package/libs/openssl"
            "package/network/services/ppp"
          )

          for path in "${IMMORTAL_PATHS[@]}"; do
            echo "Resolving ImmortalWrt: $path"

            result=$(resolve_commit \
              "immortalwrt/immortalwrt" \
              "openwrt-25.12" \
              "$path")

            printf 'immortalwrt/immortalwrt\t%s\t%s\n' \
              "$path" "$result" \
              | tee -a source-lock/source-lock.txt
          done

          echo >> source-lock/source-lock.txt
          echo "===== LEDE HISTORICAL FILES =====" \
            | tee -a source-lock/source-lock.txt

          LEDE_PATHS=(
            "target/linux/generic/hack-6.12"
            "target/linux/generic/pending-6.12/613-netfilter_optional_tcp_window_check.patch"
            "package/system/fstools/patches/0200-ntfs3-with-utf8.patch"
          )

          for path in "${LEDE_PATHS[@]}"; do
            echo "Resolving LEDE: $path"

            result=$(resolve_commit \
              "coolsnowwolf/lede" \
              "master" \
              "$path")

            printf 'coolsnowwolf/lede\t%s\t%s\n' \
              "$path" "$result" \
              | tee -a source-lock/source-lock.txt
          done

          echo >> source-lock/source-lock.txt
          echo "===== COMPLETED =====" \
            | tee -a source-lock/source-lock.txt

          cat source-lock/source-lock.txt

          {
            echo "## Historical source resolution"
            echo
            echo "- Build date: $BUILD_DATE"
            echo "- Historical cutoff: $UNTIL"
            echo "- OpenWrt base: v25.12.2"
            echo "- Kwrt commit: ab0b3066ed2152a1785fd7d4dba8a10b08b2e5c0"
            echo
            echo "Source commit resolution completed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source lock report
        uses: actions/upload-artifact@v4
        with:
          name: kwrt-source-lock-${{ inputs.build_date }}
          path: source-lock/source-lock.txt
          retention-days: 30
