
name: Resolve Kwrt Historical Source Versions

on:
  workflow_dispatch:
    inputs:
      build_date:
        description: "Original Kwrt build date"
        required: true
        default: "2026-03-30"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Resolve repository commits
        env:
          BUILD_DATE: ${{ inputs.build_date }}
        run: |
          set -euo pipefail

          if ! [[ "$BUILD_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date format"
            exit 1
          fi

          UNTIL="${BUILD_DATE} 23:59:59 +0800"

          mkdir -p source-lock

          resolve_repo() {
            local name="$1"
            local repo="$2"
            local branch="$3"
            local dir="repo-${name}"

            echo "===== Resolving ${repo} (${branch}) ====="

            git clone \
              --filter=blob:none \
              --no-checkout \
              --single-branch \
              --branch "$branch" \
              "https://github.com/${repo}.git" \
              "$dir"

            local commit
            commit=$(git -C "$dir" rev-list \
              -1 \
              --before="$UNTIL" \
              "refs/remotes/origin/${branch}")

            if [ -z "$commit" ]; then
              echo "ERROR: No commit found for ${repo}"
              return 1
            fi

            git -C "$dir" checkout --detach "$commit"

            local commit_date
            local commit_message

            commit_date=$(git -C "$dir" log -1 --format='%cI')
            commit_message=$(git -C "$dir" log -1 --format='%s')

            {
              echo "Repository: ${repo}"
              echo "Branch: ${branch}"
              echo "Commit: ${commit}"
              echo "Commit date: ${commit_date}"
              echo "Commit message: ${commit_message}"
              echo
            } | tee -a source-lock/source-lock.txt

            echo "${commit}" > "source-lock/${name}.commit"
          }

          {
            echo "KWRT HISTORICAL SOURCE LOCK"
            echo "Build date: ${BUILD_DATE}"
            echo "Cutoff: ${UNTIL}"
            echo
          } > source-lock/source-lock.txt

          echo "===== OpenWrt v25.12.2 ====="

          OPENWRT_COMMIT=$(git ls-remote \
            https://github.com/openwrt/openwrt.git \
            'refs/tags/v25.12.2^{}' | awk '{print $1}')

          if [ -z "$OPENWRT_COMMIT" ]; then
            OPENWRT_COMMIT=$(git ls-remote \
              https://github.com/openwrt/openwrt.git \
              'refs/tags/v25.12.2' | awk '{print $1}')
          fi

          if [ -z "$OPENWRT_COMMIT" ]; then
            echo "ERROR: Cannot resolve OpenWrt v25.12.2"
            exit 1
          fi

          {
            echo "Repository: openwrt/openwrt"
            echo "Tag: v25.12.2"
            echo "Commit: ${OPENWRT_COMMIT}"
            echo
          } | tee -a source-lock/source-lock.txt

          echo "$OPENWRT_COMMIT" \
            > source-lock/openwrt.commit

          resolve_repo \
            immortalwrt \
            immortalwrt/immortalwrt \
            openwrt-25.12

          resolve_repo \
            lede \
            coolsnowwolf/lede \
            master

          {
            echo "===== KWRT ORIGINAL SOURCE ====="
            echo "Repository: kiddin9/Kwrt"
            echo "Commit: ab0b3066ed2152a1785fd7d4dba8a10b08b2e5c0"
            echo
            echo "===== COMPLETED ====="
          } | tee -a source-lock/source-lock.txt

          echo "===== FINAL SOURCE LOCK ====="
          cat source-lock/source-lock.txt

          {
            echo "## Historical source lock"
            echo
            echo "- Build date: ${BUILD_DATE}"
            echo "- OpenWrt: ${OPENWRT_COMMIT}"
            echo "- ImmortalWrt: $(cat source-lock/immortalwrt.commit)"
            echo "- LEDE: $(cat source-lock/lede.commit)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source lock
        uses: actions/upload-artifact@v4
        with:
          name: kwrt-source-lock-${{ inputs.build_date }}
          path: source-lock/
          retention-days: 30
